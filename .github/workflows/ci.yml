name: Tests and example gallery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,docs]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python -m pytest
      - run: python -m build
      - name: Build and execute the example gallery
        if: matrix.python-version == '3.12'
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Install browser validation tools
        if: matrix.python-version == '3.12'
        run: |
          npm install --prefix /tmp/dc-browser playwright@1.51.1
          node /tmp/dc-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check interactive lab on desktop and mobile
        if: matrix.python-version == '3.12'
        env:
          PLAYWRIGHT_MODULE: /tmp/dc-browser/node_modules/playwright
        run: node tests/check_report.cjs docs/_build/html/_static/lab/reference-lab.html
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: documentation-and-interactive-lab
          path: |
            docs/_build/html
            outputs/browser
