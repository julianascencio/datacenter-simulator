name: documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages-status.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[docs]'
      - name: Build Sphinx and execute all six gallery examples
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Install browser validation tools
        run: |
          npm install --prefix /tmp/dc-browser playwright@1.51.1
          node /tmp/dc-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check documentation and interactive lab on desktop and mobile
        env:
          PLAYWRIGHT_MODULE: /tmp/dc-browser/node_modules/playwright
        run: |
          node tests/check_docs.cjs docs/_build/html
          node tests/check_report.cjs docs/_build/html/_static/lab/reference-lab.html
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-and-interactive-lab
          path: |
            docs/_build/html
            outputs/browser
            outputs/docs-browser
      - name: Check whether Pages is configured for Actions
        id: pages-status
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            let enabled = false;
            try {
              const response = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
              enabled = response.data.build_type === 'workflow';
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('enabled', String(enabled));
            if (!enabled) {
              await core.summary.addHeading('Documentation built; hosting not enabled')
                .addRaw('Download the documentation artifact to preview it. To publish, set Settings → Pages → Source to GitHub Actions, then rerun this workflow on main.')
                .write();
            }
      - name: Upload Pages artifact
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
